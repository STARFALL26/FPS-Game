      top: 16px;

      border-radius: 9px;

      font-size: 15px;

let audioContext = null;
let compressor = null;
let masterGain = null;


function ensureAudio() {

  if (!audioContext) {

    audioContext =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

    compressor =
      audioContext.createDynamicsCompressor();

    compressor.threshold.value = -12;
    compressor.knee.value = 8;
    compressor.ratio.value = 10;
    compressor.attack.value = .0005;
    compressor.release.value = .12;

    masterGain =
      audioContext.createGain();

    masterGain.gain.value = .68;

    compressor.connect(
      masterGain
    );

    masterGain.connect(
      audioContext.destination
    );
  }

  if (
    audioContext.state ===
    "suspended"
  ) {
    audioContext.resume();
  }
}


function createNoiseBuffer(duration) {

  const length =
    Math.ceil(
      audioContext.sampleRate *
      duration
    );

  const buffer =
    audioContext.createBuffer(
      1,
      length,
      audioContext.sampleRate
    );

  const data =
    buffer.getChannelData(0);

  for (
    let i = 0;
    i < length;
    i++
  ) {
    data[i] =
      Math.random() * 2 - 1;
  }

  return buffer;
}


function noiseImpulse(
  duration,
  volume,
  type,
  frequency,
  decay = 3,
  delay = 0
) {

  ensureAudio();

  const source =
    audioContext.createBufferSource();

  source.buffer =
    createNoiseBuffer(duration);

  const filter =
    audioContext.createBiquadFilter();

  filter.type = type;
  filter.frequency.value =
    frequency;

  const gain =
    audioContext.createGain();

  const now =
    audioContext.currentTime +
    delay;

  gain.gain.setValueAtTime(
    volume,
    now
  );

  for (
    let i = 1;
    i <= 7;
    i++
  ) {

    const life =
      1 - i / 7;

    gain.gain.linearRampToValueAtTime(
      Math.max(
        .0001,
        volume *
        Math.pow(
          life,
          decay
        )
      ),
      now +
      duration *
      i / 7
    );
  }

  source.connect(filter);
  filter.connect(gain);
  gain.connect(compressor);

  source.start(now);
  source.stop(
    now + duration
  );
}


function lowImpulse(
  startFrequency,
  endFrequency,
  duration,
  volume,
  delay = 0
) {

  ensureAudio();

  const oscillator =
    audioContext.createOscillator();

  const gain =
    audioContext.createGain();

  const now =
    audioContext.currentTime +
    delay;

  oscillator.type = "triangle";

  oscillator.frequency.setValueAtTime(
    startFrequency,
    now
  );

  oscillator.frequency.exponentialRampToValueAtTime(
    Math.max(
      20,
      endFrequency
    ),
    now + duration
  );

  gain.gain.setValueAtTime(
    volume,
    now
  );

  gain.gain.exponentialRampToValueAtTime(
    .0001,
    now + duration
  );

  oscillator.connect(gain);
  gain.connect(compressor);

  oscillator.start(now);
  oscillator.stop(
    now + duration
  );
}

function createGrassTexture() {

  const canvas =
    document.createElement(
      "canvas"
    );

  canvas.width = 512;
  canvas.height = 512;

  const ctx =
    canvas.getContext("2d");

  const gradient =
    ctx.createLinearGradient(
      0,
      0,
      512,
      512
    );

  gradient.addColorStop(
    0,
    "#718e51"
  );

  gradient.addColorStop(
    1,
    "#476c39"
  );

  ctx.fillStyle =
    gradient;

  ctx.fillRect(
    0,
    0,
    512,
    512
  );

  for (
    let i = 0;
    i < 12000;
    i++
  ) {

    const alpha =
      .03 +
      Math.random() * .12;

    ctx.fillStyle =
      Math.random() > .5
        ? `rgba(30,70,25,${alpha})`
        : `rgba(140,165,82,${alpha})`;

    ctx.fillRect(
      Math.random() * 512,
      Math.random() * 512,
      1 + Math.random() * 2,
      1 + Math.random() * 2
    );
  }

  const texture =
    new THREE.CanvasTexture(
      canvas
    );

  texture.wrapS =
    THREE.RepeatWrapping;

  texture.wrapT =
    THREE.RepeatWrapping;

  texture.repeat.set(
    36,
    36
  );

  texture.colorSpace =
    THREE.SRGBColorSpace;

  return texture;
}

function extrudeProfile(
  shape,
  width,
  material,
  bevel
) {

  const geometry =
    new THREE.ExtrudeGeometry(
      shape,
      {
        depth:
          width,
        bevelEnabled:
          true,
        bevelSegments:
          10,
        bevelSize:
          bevel,
        bevelThickness:
          bevel,
        curveSegments:
          36
      }
    );

  geometry.center();

  geometry.rotateY(
    Math.PI / 2
  );

  geometry.computeVertexNormals();

  const mesh =
    new THREE.Mesh(
      geometry,
      material
    );

  mesh.castShadow =
    true;

  return mesh;
}

  const shape =
    new THREE.Shape();

  shape.moveTo(
    -.275,
    -.055
  );

  shape.quadraticCurveTo(
    -.270,
    -.069,
    -.245,
    -.073

  shape.lineTo(
    .245,
    -.073
  );

  shape.quadraticCurveTo(
    .275,
    -.067,
    .280,
    -.040
  );

  shape.lineTo(
    .267,
    .050
  );

  shape.quadraticCurveTo(
    .260,
    .072,
    .228,
    .075
  );

  shape.lineTo(
    -.235,
    .075
  );

  shape.quadraticCurveTo(
    -.264,
    .071,
    -.271,
    .047
  );

  shape.closePath();

  return shape;
}

/* =========================================================
   POINTER LOCK CAMERA

   THIS IS THE IMPORTANT CAMERA FIX.

   The mouse cursor is no longer tracked by its position
   on the physical screen.

   Once locked, movementX and movementY tell us how far the
   mouse moved, even if you rotate continuously forever.
========================================================= */

let pointerLocked =
  false;


function requestGamePointerLock() {

  ensureAudio();


  if (
    document.pointerLockElement ===
    renderer.domElement
  ) {
    return;
  }


  if (
    renderer.domElement.requestPointerLock
  ) {

    renderer.domElement.requestPointerLock();

  }

}


/*
  Clicking the game while NOT locked captures the mouse.

  Clicking while ALREADY locked fires the pistol.
*/

renderer.domElement.addEventListener(
  "mousedown",
  e => {

    if (
      e.button !==
      0
    ) {
      return;
    }


    ensureAudio();


    if (
      document.pointerLockElement !==
      renderer.domElement
    ) {

      requestGamePointerLock();

      return;

    }


    fire();

  }
);


/*
  Browser fires this whenever mouse capture begins or ends.

  Pressing ESC automatically releases pointer lock.
*/

document.addEventListener(
  "pointerlockchange",
  () => {

    pointerLocked =
      document.pointerLockElement ===
      renderer.domElement;


    document.body.classList.toggle(
      "controlled",
      pointerLocked
    );


    /*
      Prevent an ADS state from remaining stuck if
      ESC was pressed while SHIFT was being held.
    */

    if (
      !pointerLocked
    ) {

      setADS(false);

    }

  }
);


/*
  If pointer lock fails, make sure UI doesn't falsely
  claim the mouse is captured.
*/

document.addEventListener(
  "pointerlockerror",
  () => {

    pointerLocked =
      false;


    document.body.classList.remove(
      "controlled"
    );


    showMessage(
      "CLICK AGAIN TO LOCK MOUSE"
    );

  }
);


/*
  THIS replaces the old cursor-position camera system.

  movementX / movementY contain raw relative mouse motion.

  There is NO cursor position and therefore NO screen edge.
*/

document.addEventListener(
  "mousemove",
  e => {

    if (
      !pointerLocked
    ) {
      return;
    }


    yaw -=
      e.movementX *
      mouseSensitivity;


    pitch -=
      e.movementY *
      mouseSensitivity;


    /*
      Left/right remains unlimited.

      yaw is NEVER clamped.

      You can therefore spin around continuously.
    */


    /*
      Vertical view stops just short of mathematically
      flipping the camera upside-down.

      This still lets you look almost perfectly straight
      up and straight down.
    */

    pitch =
      THREE.MathUtils.clamp(
        pitch,
        -Math.PI / 2 + .015,
        Math.PI / 2 - .015
      );

  }
);


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
  "keydown",
  e => {

    ensureAudio();


    keys[e.code] =
      true;


    if (
      e.code === "ShiftLeft" ||
      e.code === "ShiftRight"
    ) {

      e.preventDefault();


      setADS(
        true
      );

    }


    if (
      e.code ===
      "KeyR"
    ) {

      e.preventDefault();


      startReload();

    }


    /*
      We intentionally DO NOT manually handle Escape.

      The browser's Pointer Lock API handles ESC itself,
      which releases the mouse correctly and safely.
    */

  }
);


document.addEventListener(
  "keyup",
  e => {

    keys[e.code] =
      false;


    if (
      e.code === "ShiftLeft" ||
      e.code === "ShiftRight"
    ) {

      setADS(
        false
      );

    }

  }
);

/* =========================================================
   MOVEMENT
========================================================= */

let joystickX = 0;
let joystickY = 0;


function updateMovement(delta) {

  let forward = 0;
  let sideways = 0;


  if (
    keys["KeyW"]
  ) {
    forward++;
  }


  if (
    keys["KeyS"]
  ) {
    forward--;
  }


  if (
    keys["KeyA"]
  ) {
    sideways--;
  }


  if (
    keys["KeyD"]
  ) {
    sideways++;
  }


  forward +=
    -joystickY;


  sideways +=
    joystickX;


  const length =
    Math.hypot(
      forward,
      sideways
    );


  if (
    length > 1
  ) {

    forward /=
      length;


    sideways /=
      length;

  }


  const speed =
    reloading
      ? 1.8
      : ads
        ? 2.3
        : 3.8;


  const forwardX =
    -Math.sin(yaw);


  const forwardZ =
    -Math.cos(yaw);


  const rightX =
    Math.cos(yaw);


  const rightZ =
    -Math.sin(yaw);


  player.x +=
    (
      forwardX * forward +
      rightX * sideways
    ) *
    speed *
    delta;


  player.z +=
    (
      forwardZ * forward +
      rightZ * sideways
    ) *
    speed *
    delta;

}

function createBulletHole(hit) {

  const onTarget =
    target.children.includes(
      hit.object
    );


  const hole =
    new THREE.Mesh(
      new THREE.CircleGeometry(
        onTarget
          ? .032
          : .027,
        24
      ),
      onTarget
        ? targetHoleMaterial
        : wallHoleMaterial
    );


  hole.position.copy(
    hit.point
  );


  let normal =
    new THREE.Vector3(
      0,
      0,
      1
    );


  if (
    hit.face
  ) {

    normal =
      hit.face.normal.clone();


    normal.transformDirection(
      hit.object.matrixWorld
    );

  }


  const q =
    new THREE.Quaternion();


  q.setFromUnitVectors(
    new THREE.Vector3(
      0,
      0,
      1
    ),
    normal
  );


  hole.quaternion.copy(q);


  hole.position.addScaledVector(
    normal,
    .007
  );


  hole.renderOrder = 50;


  scene.add(hole);


  bulletHoles.push(hole);


  if (
    bulletHoles.length > 200
  ) {

    const old =
      bulletHoles.shift();


    scene.remove(old);

  }

}


function fire() {

  if (
    reloading
  ) {
    return;
  }


  triggerPull = 1;


  if (
    player.ammo <= 0
  ) {

    soundEmpty();


    showMessage(
      "MAG EMPTY • RELOAD REQUIRED"
    );


    return;

  }


  soundGunshot();


  player.ammo--;


  ammoText.textContent =
    player.ammo;


  slideKick = .097;


  if (
    ads
  ) {

    weaponKickBack = .031;
    weaponKickUp = .031;


    recoilPitch +=
      .008 +
      Math.random() *
      .003;


    recoilYaw +=
      (
        Math.random() -
        .5
      ) *
      .003;

  }

  else {

    weaponKickBack = .052;
    weaponKickUp = .052;


    recoilPitch +=
      .018 +
      Math.random() *
      .005;


    recoilYaw +=
      (
        Math.random() -
        .5
      ) *
      .007;

  }


  flashTimer = .043;


  flash.visible = true;


  muzzleLight.intensity = 6;


  ejectCasing();


  const spread =
    ads
      ? 4
      : 34;


  const angle =
    Math.random() *
    Math.PI *
    2;


  const radius =
    Math.sqrt(
      Math.random()
    ) *
    spread;


  shotPoint.set(
    Math.cos(angle) *
    radius /
    innerWidth *
    2,

    -Math.sin(angle) *
    radius /
    innerHeight *
    2
  );


  raycaster.setFromCamera(
    shotPoint,
    camera
  );


  const hits =
    raycaster.intersectObjects(
      [
        ...target.children,
        wall,
        ground
      ],
      false
    );


  if (
    hits.length
  ) {

    const hit =
      hits[0];


    if (
      hit.object !== ground
    ) {

      createBulletHole(hit);

    }


    if (
      target.children.includes(
        hit.object
      )
    ) {

      scoreHit(
        hit.point
      );

    }

  }


  if (
    player.ammo === 0
  ) {

    slideLocked = true;

  }

}


/* =========================================================
   SCORE
========================================================= */

function scoreHit(point) {

  const distance =
    Math.hypot(
      point.x -
      target.position.x,
      point.y -
      target.position.y
    );


  let points;


  if (distance <= .19) points = 10;
  else if (distance <= .40) points = 8;
  else if (distance <= .63) points = 6;
  else if (distance <= .86) points = 4;
  else if (distance <= 1.08) points = 2;
  else points = 1;


  player.score +=
    points;


  scoreText.textContent =
    player.score;


  hitMarker.style.display =
    "block";


  setTimeout(
    () => {

      hitMarker.style.display =
        "none";

    },
    90
  );

}


/* =========================================================
   CASINGS
========================================================= */

const casings = [];


function ejectCasing() {

  const casing =
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        .009,
        .009,
        .035,
        18
      ),
      brassMaterial
    );


  casing.rotation.x =
    Math.PI / 2;


  const position =
    new THREE.Vector3();


  ejectAnchor.getWorldPosition(
    position
  );


  casing.position.copy(
    position
  );


  scene.add(casing);


  const velocity =
    new THREE.Vector3(
      .80 +
      Math.random() *
      .28,
      1.08 +
      Math.random() *
      .34,
      .10 +
      Math.random() *
      .22
    );


  velocity.applyQuaternion(
    camera.quaternion
  );


  casings.push({
    mesh:
      casing,
    velocity,
    spin:
      new THREE.Vector3(
        14,
        12,
        15
      ),
    life:
      1.7
  });

}


/* =========================================================
   THROWN MAGAZINES
========================================================= */

const thrownMagazines = [];


function throwMagazineFrom(
  sourceMagazine
) {

  const thrown =
    createMagazine();


  const worldPosition =
    new THREE.Vector3();


  sourceMagazine.getWorldPosition(
    worldPosition
  );


  const worldQuaternion =
    new THREE.Quaternion();


  sourceMagazine.getWorldQuaternion(
    worldQuaternion
  );


  thrown.position.copy(
    worldPosition
  );


  thrown.quaternion.copy(
    worldQuaternion
  );


  scene.add(thrown);


  const velocity =
    new THREE.Vector3(
      -5.8,
      2.4,
      -.7
    );


  velocity.applyQuaternion(
    camera.quaternion
  );


  thrownMagazines.push({
    mesh:
      thrown,
    velocity,
    spin:
      new THREE.Vector3(
        18,
        24,
        19
      ),
    life:
      2.4
  });

}


/* =========================================================
   OBJECT PHYSICS
========================================================= */

function updateLooseObjects(delta) {

  for (
    let i =
      casings.length - 1;
    i >= 0;
    i--
  ) {

    const casing =
      casings[i];


    casing.velocity.y -=
      5.8 * delta;


    casing.mesh.position.addScaledVector(
      casing.velocity,
      delta
    );


    casing.mesh.rotation.x +=
      casing.spin.x *
      delta;


    casing.mesh.rotation.y +=
      casing.spin.y *
      delta;


    casing.mesh.rotation.z +=
      casing.spin.z *
      delta;


    casing.life -= delta;


    if (
      casing.life <= 0
    ) {

      scene.remove(
        casing.mesh
      );


      casings.splice(
        i,
        1
      );

    }

  }


  for (
    let i =
      thrownMagazines.length - 1;
    i >= 0;
    i--
  ) {

    const mag =
      thrownMagazines[i];


    mag.velocity.y -=
      6.5 * delta;


    mag.mesh.position.addScaledVector(
      mag.velocity,
      delta
    );


    mag.mesh.rotation.x +=
      mag.spin.x *
      delta;


    mag.mesh.rotation.y +=
      mag.spin.y *
      delta;


    mag.mesh.rotation.z +=
      mag.spin.z *
      delta;


    mag.life -= delta;


    if (
      mag.life <= 0
    ) {

      scene.remove(
        mag.mesh
      );


      thrownMagazines.splice(
        i,
        1
      );

    }

  }

}


/* =========================================================
   RELOAD
========================================================= */

let reloading = false;
let reloadStart = 0;


const RELOAD_LENGTH =
  3.55;


let magOutSoundPlayed = false;
let oldMagThrown = false;
let magInSoundPlayed = false;
let slidePullPlayed = false;
let slideReleasePlayed = false;


const handHidden =
  new THREE.Vector3(
    -.34,
    -.82,
    .08
  );


const handOldMag =
  new THREE.Vector3(
    -.10,
    -.37,
    .06
  );


const handRip =
  new THREE.Vector3(
    -.14,
    -.58,
    .05
  );


const handThrow =
  new THREE.Vector3(
    -.50,
    -.50,
    .04
  );


const handFresh =
  new THREE.Vector3(
    -.15,
    -.64,
    .05
  );


const handAlign =
  new THREE.Vector3(
    -.08,
    -.48,
    .03
  );


const handSeat =
  new THREE.Vector3(
    -.05,
    -.24,
    .03
  );


const handSlideFront =
  new THREE.Vector3(
    -.07,
    .11,
    -.22
  );


const handSlideRear =
  new THREE.Vector3(
    -.16,
    .09,
    .02
  );


function clamp01(value) {

  return THREE.MathUtils.clamp(
    value,
    0,
    1
  );

}


function smooth(value) {

  const t =
    clamp01(value);


  return (
    t *
    t *
    (
      3 -
      2 *
      t
    )
  );

}


function snap(value) {

  const t =
    clamp01(value);


  return (
    1 -
    Math.pow(
      1 - t,
      5
    )
  );

}


function moveBetween(
  object,
  start,
  end,
  amount
) {

  object.position.lerpVectors(
    start,
    end,
    amount
  );

}


function startReload() {

  if (
    reloading ||
    player.ammo === 12
  ) {
    return;
  }


  setADS(false);


  reloading = true;


  reloadStart =
    performance.now() /
    1000;


  magOutSoundPlayed = false;
  oldMagThrown = false;
  magInSoundPlayed = false;
  slidePullPlayed = false;
  slideReleasePlayed = false;


  modeText.textContent =
    "RELOADING";


  oldMagazine.visible =
    true;


  oldMagazine.position.set(
    0,
    MAG_FULLY_INSERTED_Y,
    MAG_Z
  );


  freshMagazine.visible =
    false;


  freshMagazine.position.set(
    0,
    MAG_START_Y,
    MAG_Z
  );


  leftHand.visible =
    true;


  leftHand.position.copy(
    handHidden
  );


  leftHand.rotation.set(
    0,
    0,
    0
  );

}


function updateReload() {

  if (
    !reloading
  ) {

    reloadShake =
      THREE.MathUtils.lerp(
        reloadShake,
        0,
        .24
      );


    return;

  }


  const t =
    performance.now() /
    1000 -
    reloadStart;


  reloadShake = 0;


  if (
    t < .32
  ) {

    const p =
      snap(
        t / .32
      );


    moveBetween(
      leftHand,
      handHidden,
      handOldMag,
      p
    );

  }


  else if (
    t < .68
  ) {

    const p =
      snap(
        (
          t - .32
        ) /
        .36
      );


    if (
      !magOutSoundPlayed
    ) {

      magOutSoundPlayed =
        true;


      soundMagOut();

    }


    moveBetween(
      leftHand,
      handOldMag,
      handRip,
      p
    );


    oldMagazine.position.y =
      THREE.MathUtils.lerp(
        MAG_FULLY_INSERTED_Y,
        -.49,
        p
      );


    reloadShake =
      Math.sin(
        p *
        Math.PI *
        10
      ) *
      .025 *
      (
        1 - p
      );

  }


  else if (
    t < .88
  ) {

    const p =
      snap(
        (
          t - .68
        ) /
        .20
      );


    if (
      !oldMagThrown
    ) {

      oldMagThrown = true;


      throwMagazineFrom(
        oldMagazine
      );


      oldMagazine.visible =
        false;

    }


    moveBetween(
      leftHand,
      handRip,
      handThrow,
      p
    );


    leftHand.rotation.z =
      -p * .8;

  }


  else if (
    t < 1.18
  ) {

    const p =
      snap(
        (
          t - .88
        ) /
        .30
      );


    moveBetween(
      leftHand,
      handThrow,
      handHidden,
      p
    );

  }


  else if (
    t < 1.48
  ) {

    const p =
      snap(
        (
          t - 1.18
        ) /
        .30
      );


    freshMagazine.visible =
      true;


    moveBetween(
      leftHand,
      handHidden,
      handFresh,
      p
    );


    freshMagazine.position.set(
      THREE.MathUtils.lerp(
        -.10,
        0,
        p
      ),
      THREE.MathUtils.lerp(
        MAG_START_Y,
        -.56,
        p
      ),
      THREE.MathUtils.lerp(
        .10,
        MAG_Z,
        p
      )
    );

  }


  else if (
    t < 1.82
  ) {

    const p =
      smooth(
        (
          t - 1.48
        ) /
        .34
      );


    moveBetween(
      leftHand,
      handFresh,
      handAlign,
      p
    );


    freshMagazine.position.set(
      THREE.MathUtils.lerp(
        -.03,
        0,
        p
      ),
      THREE.MathUtils.lerp(
        -.56,
        MAG_ALIGN_Y,
        p
      ),
      MAG_Z
    );


    freshMagazine.rotation.z =
      Math.sin(
        p *
        Math.PI *
        4
      ) *
      .055 *
      (
        1 - p
      );

  }


  else if (
    t < 2.25
  ) {

    const p =
      smooth(
        (
          t - 1.82
        ) /
        .43
      );


    moveBetween(
      leftHand,
      handAlign,
      handSeat,
      p
    );


    freshMagazine.visible =
      true;


    freshMagazine.position.x =
      0;


    freshMagazine.position.z =
      MAG_Z;


    freshMagazine.position.y =
      THREE.MathUtils.lerp(
        MAG_ALIGN_Y,
        MAG_FULLY_INSERTED_Y,
        p
      );


    freshMagazine.rotation.z =
      Math.sin(
        p *
        Math.PI *
        5
      ) *
      .035 *
      (
        1 - p
      );


    if (
      p > .86
    ) {

      if (
        !magInSoundPlayed
      ) {

        magInSoundPlayed =
          true;


        soundMagIn();

      }


      const impact =
        (
          p - .86
        ) /
        .14;


      reloadShake =
        Math.sin(
          impact *
          Math.PI *
          7
        ) *
        .045 *
        (
          1 - impact
        );

    }

  }


  else if (
    t < 2.52
  ) {

    const p =
      snap(
        (
          t - 2.25
        ) /
        .27
      );


    freshMagazine.visible =
      true;


    freshMagazine.position.set(
      0,
      MAG_FULLY_INSERTED_Y,
      MAG_Z
    );


    freshMagazine.rotation.set(
      0,
      0,
      0
    );


    moveBetween(
      leftHand,
      handSeat,
      handSlideFront,
      p
    );


    leftHand.rotation.x =
      -p *
      .45;

  }


  else if (
    t < 2.86
  ) {

    const p =
      snap(
        (
          t - 2.52
        ) /
        .34
      );


    freshMagazine.visible =
      true;


    freshMagazine.position.set(
      0,
      MAG_FULLY_INSERTED_Y,
      MAG_Z
    );


    if (
      !slidePullPlayed
    ) {

      slidePullPlayed =
        true;


      soundSlidePull();

    }


    moveBetween(
      leftHand,
      handSlideFront,
      handSlideRear,
      p
    );


    slideGroup.position.z =
      THREE.MathUtils.lerp(
        0,
        .158,
        p
      );


    gun.rotation.x =
      -p *
      .085;


    gun.rotation.z =
      -p *
      .16;

  }


  else if (
    t < 3.02
  ) {

    const p =
      snap(
        (
          t - 2.86
        ) /
        .16
      );


    freshMagazine.visible =
      true;


    freshMagazine.position.set(
      0,
      MAG_FULLY_INSERTED_Y,
      MAG_Z
    );


    if (
      !slideReleasePlayed
    ) {

      slideReleasePlayed =
        true;


      soundSlideRelease();

    }


    slideGroup.position.z =
      THREE.MathUtils.lerp(
        .158,
        0,
        p
      );


    reloadShake =
      Math.sin(
        p *
        Math.PI *
        8
      ) *
      .035 *
      (
        1 - p
      );

  }


  else if (
    t < RELOAD_LENGTH
  ) {

    const p =
      snap(
        (
          t - 3.02
        ) /
        (
          RELOAD_LENGTH -
          3.02
        )
      );


    freshMagazine.visible =
      true;


    freshMagazine.position.set(
      0,
      MAG_FULLY_INSERTED_Y,
      MAG_Z
    );


    moveBetween(
      leftHand,
      handSlideRear,
      handHidden,
      p
    );


    gun.rotation.x =
      THREE.MathUtils.lerp(
        gun.rotation.x,
        0,
        .25
      );


    gun.rotation.z =
      THREE.MathUtils.lerp(
        gun.rotation.z,
        0,
        .25
      );

  }


  else {

    finishReload();

  }

}


function finishReload() {

  reloading = false;


  leftHand.visible = false;


  leftHand.rotation.set(
    0,
    0,
    0
  );


  oldMagazine.visible = false;


  freshMagazine.visible = false;


  slideLocked = false;


  slideKick = 0;


  slideGroup.position.z = 0;


  gun.position.set(
    0,
    0,
    0
  );


  gun.rotation.set(
    0,
    0,
    0
  );


  reloadShake = 0;


  player.ammo = 12;


  ammoText.textContent = 12;


  modeText.textContent =
    "HIP FIRE";

}


/* =========================================================
   RECOIL
========================================================= */

function updateRecoil() {

  const recovery =
    ads
      ? .17
      : .115;


  recoilPitch =
    THREE.MathUtils.lerp(
      recoilPitch,
      0,
      recovery
    );


  recoilYaw =
    THREE.MathUtils.lerp(
      recoilYaw,
      0,
      recovery
    );


  if (
    !reloading
  ) {

    if (
      slideLocked
    ) {

      slideGroup.position.z =
        THREE.MathUtils.lerp(
          slideGroup.position.z,
          .085,
          .20
        );

    }

    else {

      slideKick =
        THREE.MathUtils.lerp(
          slideKick,
          0,
          .27
        );


      slideGroup.position.z =
        slideKick;

    }

  }


  weaponKickBack =
    THREE.MathUtils.lerp(
      weaponKickBack,
      0,
      .18
    );


  weaponKickUp =
    THREE.MathUtils.lerp(
      weaponKickUp,
      0,
      .15
    );

}


/* =========================================================
   FLASH
========================================================= */

function updateFlash(delta) {

  if (
    flashTimer > 0
  ) {

    flashTimer -= delta;


    const pulse =
      .82 +
      Math.random() *
      .30;


    flash.scale.set(
      .28 * pulse,
      .28 * pulse,
      .28 * pulse
    );


    flash.material.rotation =
      Math.random() *
      Math.PI;


    muzzleLight.intensity =
      4 +
      Math.random() *
      4;

  }

  else {

    flash.visible =
      false;


    muzzleLight.intensity =
      0;

  }

}


/* =========================================================
   MOBILE LOOK

   Pointer lock is desktop-only.

   Touch controls remain separate.
========================================================= */

let lookTouch =
  null;


let touchLookX =
  0;

let touchLookY =
  0;


renderer.domElement.addEventListener(
  "touchstart",
  e => {

    for (
      const touch
      of e.changedTouches
    ) {

      if (
        touch.clientX >
        innerWidth *
        .34
      ) {

        lookTouch =
          touch.identifier;


        touchLookX =
          touch.clientX;


        touchLookY =
          touch.clientY;


        break;

      }

    }

  },
  {
    passive: false
  }
);


renderer.domElement.addEventListener(
  "touchmove",
  e => {

    for (
      const touch
      of e.changedTouches
    ) {

      if (
        touch.identifier ===
        lookTouch
      ) {

        const dx =
          touch.clientX -
          touchLookX;


        const dy =
          touch.clientY -
          touchLookY;


        yaw -=
          dx * .006;


        pitch -=
          dy * .006;


        pitch =
          THREE.MathUtils.clamp(
            pitch,
            -Math.PI / 2 + .015,
            Math.PI / 2 - .015
          );


        touchLookX =
          touch.clientX;


        touchLookY =
          touch.clientY;


        e.preventDefault();

      }

    }

  },
  {
    passive: false
  }
);


/* =========================================================
   MOBILE JOYSTICK
========================================================= */

const joystick =
  document.getElementById(
    "joystick"
  );


const stick =
  document.getElementById(
    "stick"
  );


let joystickTouch =
  null;


joystick.addEventListener(
  "touchstart",
  e => {

    const touch =
      e.changedTouches[0];


    joystickTouch =
      touch.identifier;


    moveJoystick(
      touch
    );


    e.preventDefault();

  }
);


joystick.addEventListener(
  "touchmove",
  e => {

    for (
      const touch
      of e.changedTouches
    ) {

      if (
        touch.identifier ===
        joystickTouch
      ) {

        moveJoystick(
          touch
        );


        e.preventDefault();

      }

    }

  }
);


joystick.addEventListener(
  "touchend",
  () => {

    joystickX = 0;
    joystickY = 0;


    stick.style.left =
      "35px";


    stick.style.top =
      "35px";

  }
);


function moveJoystick(touch) {

  const rect =
    joystick.getBoundingClientRect();


  let x =
    touch.clientX -
    rect.left -
    60;


  let y =
    touch.clientY -
    rect.top -
    60;


  const length =
    Math.hypot(
      x,
      y
    );


  if (
    length > 40
  ) {

    x =
      x /
      length *
      40;


    y =
      y /
      length *
      40;

  }


  joystickX =
    x / 40;


  joystickY =
    y / 40;


  stick.style.left =
    35 +
    x +
    "px";


  stick.style.top =
    35 +
    y +
    "px";

}


/* =========================================================
   MOBILE FIRE / ADS
========================================================= */

document
  .getElementById(
    "fireButton"
  )
  .addEventListener(
    "touchstart",
    e => {

      ensureAudio();


      e.preventDefault();


      fire();

    }
  );


const adsButton =
  document.getElementById(
    "adsButton"
  );


adsButton.addEventListener(
  "touchstart",
  e => {

    e.preventDefault();


    setADS(true);

  }
);


adsButton.addEventListener(
  "touchend",
  e => {

    e.preventDefault();


    setADS(false);

  }
);


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
  "resize",
  () => {

    renderer.setSize(
      innerWidth,
      innerHeight
    );


    renderer.setPixelRatio(
      Math.min(
        devicePixelRatio,
        2
      )
    );


    camera.aspect =
      innerWidth /
      innerHeight;


    camera.updateProjectionMatrix();

  }
);


/* =========================================================
   START
========================================================= */

loading.style.display =
  "none";


/* =========================================================
   GAME LOOP
========================================================= */

const clock =
  new THREE.Clock();


function animate() {

  requestAnimationFrame(
    animate
  );


  const delta =
    Math.min(
      clock.getDelta(),
      .033
    );


  updateMovement(delta);


  updateTrigger(delta);


  updateRecoil();


  updateReload();


  updateCamera();


  updateWeapon();


  updateFlash(delta);


  updateLooseObjects(delta);


  renderer.render(
    scene,
    camera
  );

}


animate();

</script>
