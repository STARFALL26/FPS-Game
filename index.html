<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>FPS Game</title>

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #7fc4e8;
      font-family: Arial, Helvetica, sans-serif;
      user-select: none;
      touch-action: none;
    }

    #game { position: fixed; inset: 0; cursor: crosshair; }
    body.locked #game { cursor: none; }
    canvas { display: block; width: 100%; height: 100%; }

    #hud {
      position: fixed;
      left: 16px;
      top: 16px;
      z-index: 20;
      padding: 11px 14px;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 10px;
      background: rgba(10,18,16,.38);
      color: white;
      font-weight: 700;
      font-size: 14px;
      line-height: 1.55;
      backdrop-filter: blur(6px);
      text-shadow: 0 2px 5px rgba(0,0,0,.75);
      pointer-events: none;
    }

    #mode { margin-top: 4px; font-size: 11px; color: #d7ead0; letter-spacing: .04em; }

    #controls {
      position: fixed;
      right: 16px;
      top: 16px;
      z-index: 20;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(10,18,16,.32);
      color: white;
      font-size: 12px;
      line-height: 1.5;
      backdrop-filter: blur(6px);
      pointer-events: none;
    }

    #prompt {
      position: fixed;
      left: 50%;
      top: 72%;
      transform: translate(-50%,-50%);
      z-index: 25;
      padding: 11px 17px;
      border-radius: 30px;
      background: rgba(0,0,0,.48);
      color: white;
      font-size: 14px;
      font-weight: 700;
      pointer-events: none;
    }
    body.locked #prompt { display: none; }

    #message {
      position: fixed;
      left: 50%;
      top: 37%;
      transform: translate(-50%,-50%);
      z-index: 30;
      opacity: 0;
      color: white;
      font-size: clamp(22px,3vw,38px);
      font-weight: 900;
      letter-spacing: .04em;
      text-shadow: 0 3px 10px black;
      transition: opacity .08s ease;
      pointer-events: none;
    }
    #message.show { opacity: 1; }

    #modelStatus {
      position: fixed;
      left: 16px;
      bottom: 16px;
      z-index: 20;
      padding: 8px 10px;
      border-radius: 8px;
      background: rgba(0,0,0,.34);
      color: rgba(255,255,255,.9);
      font-size: 11px;
      pointer-events: none;
    }

    #crosshair {
      position: fixed;
      left: 50%;
      top: 50%;
      width: 32px;
      height: 32px;
      transform: translate(-50%,-50%);
      z-index: 24;
      pointer-events: none;
      transition: transform .12s ease, opacity .12s ease;
    }

    .cross {
      position: absolute;
      background: white;
      box-shadow: 0 0 2px black, 0 0 5px rgba(0,0,0,.8);
    }
    .ct { width:2px; height:7px; left:15px; top:0; }
    .cb { width:2px; height:7px; left:15px; bottom:0; }
    .cl { width:7px; height:2px; left:0; top:15px; }
    .cr { width:7px; height:2px; right:0; top:15px; }
    .dot {
      position:absolute;
      left:14px;
      top:14px;
      width:4px;
      height:4px;
      border-radius:50%;
      background:#ff3434;
      box-shadow:0 0 3px black;
    }
    body.ads #crosshair {
      transform: translate(-50%,-50%) scale(.64);
      opacity: .82;
    }

    #hitMarker {
      position: fixed;
      left: 50%;
      top: 50%;
      width: 28px;
      height: 28px;
      transform: translate(-50%,-50%);
      display: none;
      z-index: 26;
      pointer-events: none;
    }
    #hitMarker::before, #hitMarker::after {
      content:"";
      position:absolute;
      left:13px;
      top:3px;
      width:2px;
      height:22px;
      background:white;
      box-shadow:0 0 3px black;
    }
    #hitMarker::before { transform:rotate(45deg); }
    #hitMarker::after { transform:rotate(-45deg); }

    #joystick {
      position: fixed;
      left: 24px;
      bottom: 28px;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      z-index: 30;
      border: 2px solid rgba(255,255,255,.34);
      background: rgba(0,0,0,.2);
    }
    #stick {
      position: absolute;
      left: 35px;
      top: 35px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(255,255,255,.72);
    }

    #fireButton, #adsButton {
      position: fixed;
      z-index: 30;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,.42);
      color: white;
      font-weight: 800;
    }
    #fireButton {
      right: 25px;
      bottom: 31px;
      width: 90px;
      height: 90px;
      background: rgba(170,28,28,.82);
    }
    #adsButton {
      right: 45px;
      bottom: 138px;
      width: 66px;
      height: 66px;
      background: rgba(28,45,34,.78);
    }

    @media(pointer:fine) {
      #joystick, #fireButton, #adsButton { display:none; }
    }
    @media(pointer:coarse) {
      #controls, #prompt { display:none; }
    }
  </style>

    bottomColor: { value: new THREE.Color(0xe9f4ee) },
    offset: { value: 18 },
    exponent: { value: 0.72 }
  },
  vertexShader: `
    varying vec3 vWorldPosition;
    void main() {
      vec4 worldPosition = modelMatrix * vec4(position, 1.0);
      vWorldPosition = worldPosition.xyz;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform vec3 topColor;
    uniform vec3 bottomColor;
    uniform float offset;
    uniform float exponent;
    varying vec3 vWorldPosition;
    void main() {
      float h = normalize(vWorldPosition + vec3(0.0, offset, 0.0)).y;
      float mixValue = max(pow(max(h, 0.0), exponent), 0.0);
      gl_FragColor = vec4(mix(bottomColor, topColor, mixValue), 1.0);
    }
  `
});
scene.add(new THREE.Mesh(skyGeo, skyMat));

/* =========================================================

function makeGroundTexture() {
  const c = document.createElement('canvas');
  c.width = 1024;
  c.height = 1024;
  const ctx = c.getContext('2d');

  const g = ctx.createLinearGradient(0, 0, 1024, 1024);
  g.addColorStop(0, '#6d8c50');
  g.addColorStop(.5, '#587942');
  g.addColorStop(1, '#466a37');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,1024,1024);

  for (let i=0;i<26000;i++) {
    const a = .025 + Math.random() * .1;
    ctx.fillStyle = Math.random() > .52
      ? `rgba(30,63,25,${a})`
      : `rgba(164,178,96,${a})`;
    const s = 1 + Math.random()*3;
    ctx.fillRect(Math.random()*1024, Math.random()*1024, s, s);
  }

  for (let i=0;i<600;i++) {
    ctx.strokeStyle = `rgba(30,65,25,${.04 + Math.random()*.08})`;
    ctx.lineWidth = .5 + Math.random();
    const x = Math.random()*1024;
    const y = Math.random()*1024;
    ctx.beginPath();
    ctx.moveTo(x,y);
    ctx.lineTo(x + (Math.random()-.5)*7, y - 7 - Math.random()*12);
    ctx.stroke();
  }

  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = THREE.RepeatWrapping;
  tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(36,36);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = Math.min(renderer.capabilities.getMaxAnisotropy(), 8);
  return tex;
}

  slide.position.set(0,.06,-.16);

  return g;

/* =========================================================
   GLB MODEL LOADING
========================================================= */

function normalizeLoadedWeapon(model) {
  model.updateMatrixWorld(true);

  const box = new THREE.Box3().setFromObject(model);
  const size = new THREE.Vector3();
  const center = new THREE.Vector3();

  box.getSize(size);
  box.getCenter(center);

  const maxAxis = Math.max(size.x,size.y,size.z) || 1;

  // Normalize the model to a predictable size.
  const desiredLength = .68;
  const scale = desiredLength / maxAxis;
  model.scale.setScalar(scale);

  // Recalculate after scaling.
  model.updateMatrixWorld(true);
  const box2 = new THREE.Box3().setFromObject(model);
  const center2 = new THREE.Vector3();
  box2.getCenter(center2);

  // Move its center near the weapon origin.
  model.position.sub(center2);

  // Most downloaded gun models use different axes.
  // These defaults put the longest dimension roughly down -Z.
  model.rotation.set(0, Math.PI, 0);

  model.traverse(obj=>{
    if (obj.isMesh) {
      obj.castShadow = true;
      obj.receiveShadow = true;

      if (obj.material) {
        obj.material.envMapIntensity = 1.0;
        obj.material.needsUpdate = true;
      }
    }
  });
}

const gltfLoader = new GLTFLoader();

gltfLoader.load(
  MODEL_PATH,
  gltf => {
    realWeapon = gltf.scene;
    normalizeLoadedWeapon(realWeapon);
    weaponVisual.add(realWeapon);

    fallbackWeapon.visible = false;
    realModelLoaded = true;

    modelStatus.textContent = 'Weapon: real GLB model loaded';
  },
  undefined,
  err => {
    console.warn('pistol.glb not found. Using fallback pistol.', err);
    fallbackWeapon.visible = true;
    realModelLoaded = false;
    modelStatus.textContent = 'Weapon: fallback (add models/pistol.glb)';
  }
);

function makeFlashTexture() {
  const c = document.createElement('canvas');
  c.width = 128;
  c.height = 128;
  const ctx = c.getContext('2d');

  const g = ctx.createRadialGradient(64,64,1,64,64,62);
  g.addColorStop(0,'rgba(255,255,255,1)');
  g.addColorStop(.15,'rgba(255,248,185,1)');
  g.addColorStop(.38,'rgba(255,165,30,.92)');
  g.addColorStop(.75,'rgba(255,70,0,.25)');
  g.addColorStop(1,'rgba(255,60,0,0)');

  ctx.fillStyle = g;
  ctx.fillRect(0,0,128,128);
  return new THREE.CanvasTexture(c);
}

const muzzleFlash = new THREE.Sprite(
  new THREE.SpriteMaterial({
    map:makeFlashTexture(),
    transparent:true,
    blending:THREE.AdditiveBlending,
    depthWrite:false
  })
);
muzzleFlash.scale.set(.26,.26,.26);
muzzleFlash.visible = false;
muzzleAnchor.add(muzzleFlash);

const muzzleLight = new THREE.PointLight(0xff9d28,0,2.4);
muzzleAnchor.add(muzzleLight);

/* =========================================================
   MAGAZINE / RELOAD HAND
========================================================= */

function createMagazine() {
  const g = new THREE.Group();
  const body = new THREE.Mesh(
    new THREE.BoxGeometry(.04,.20,.05),
    magazineMat
  );
  body.castShadow = true;
  g.add(body);

  const base = new THREE.Mesh(
    new THREE.BoxGeometry(.05,.012,.06),
    magazineMat
  );
  base.position.y = -.106;
  base.castShadow = true;
  g.add(base);
  return g;
}

const oldMagazine = createMagazine();
oldMagazine.visible = false;
weaponRoot.add(oldMagazine);

const freshMagazine = createMagazine();
freshMagazine.visible = false;
weaponRoot.add(freshMagazine);

const reloadHand = new THREE.Mesh(
  new THREE.SphereGeometry(1,36,28),
  skinMat
);
reloadHand.scale.set(.09,.13,.08);
reloadHand.visible = false;
weaponRoot.add(reloadHand);

/* =========================================================
   PLAYER STATE
========================================================= */

const player = {
  x:0,
  z:1,
  eyeHeight:1.68,
  ammo:12,
  score:0
};

const keys = {};

let yaw = 0;
let pitch = 0;
let ads = false;
let pointerLocked = false;

let currentFov = 72;
let targetFov = 72;

let recoilPitch = 0;
let recoilYaw = 0;
let weaponKick = 0;
let weaponTilt = 0;

const mouseSensitivity = .00225;

/* =========================================================
   POINTER LOCK
========================================================= */

renderer.domElement.addEventListener('mousedown', e=>{
  if (e.button !== 0) return;

  if (document.pointerLockElement !== renderer.domElement) {
    renderer.domElement.requestPointerLock();
    return;
  }

  fire();
});

document.addEventListener('pointerlockchange', ()=>{
  pointerLocked = document.pointerLockElement === renderer.domElement;
  document.body.classList.toggle('locked', pointerLocked);

  if (!pointerLocked) {
    setADS(false);
  }
});

document.addEventListener('mousemove', e=>{
  if (!pointerLocked) return;

  yaw -= e.movementX * mouseSensitivity;
  pitch -= e.movementY * mouseSensitivity;

  pitch = THREE.MathUtils.clamp(
    pitch,
    -Math.PI/2 + .015,
    Math.PI/2 - .015
  );
});

/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener('keydown', e=>{
  keys[e.code] = true;

  if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') {
    e.preventDefault();
    setADS(true);
  }

  if (e.code === 'KeyR') {
    e.preventDefault();
    startReload();
  }
});

document.addEventListener('keyup', e=>{
  keys[e.code] = false;

  if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') {
    setADS(false);
  }
});

/* =========================================================
   ADS
========================================================= */

function setADS(value) {
  if (reloading) value = false;

  ads = value;
  targetFov = ads ? 45 : 72;

  document.body.classList.toggle('ads', ads);

  if (!reloading) {
    modeText.textContent = ads
      ? 'ADS • TIGHT SPREAD'
      : 'HIP FIRE';
  }
}

/* =========================================================
   CAMERA / WEAPON POSE
========================================================= */

const hipPos = new THREE.Vector3(.22,-.25,-1.05);
const adsPos = new THREE.Vector3(0,-.145,-.82);
const reloadPos = new THREE.Vector3(.24,-.23,-.96);

function updateCamera(delta) {
  camera.position.set(player.x,player.eyeHeight,player.z);

  const fovLerp = 1 - Math.exp(-10*delta);
  currentFov = THREE.MathUtils.lerp(currentFov,targetFov,fovLerp);
  camera.fov = currentFov;
  camera.updateProjectionMatrix();

  camera.rotation.y = yaw + recoilYaw;
  camera.rotation.x = pitch + recoilPitch;
}

function updateWeapon(delta) {
  const target = reloading ? reloadPos : ads ? adsPos : hipPos;
  weaponRig.position.lerp(target,1-Math.exp(-13*delta));

  const targetScale = ads ? .72 : reloading ? .58 : .54;
  const scale = THREE.MathUtils.lerp(
    weaponRig.scale.x || targetScale,
    targetScale,
    1-Math.exp(-12*delta)
  );
  weaponRig.scale.setScalar(scale);

  const baseRoll = reloading ? -.28 : ads ? 0 : -.035;
  weaponRig.rotation.z = THREE.MathUtils.lerp(
    weaponRig.rotation.z,
    baseRoll + weaponTilt,
    1-Math.exp(-15*delta)
  );

  weaponRig.rotation.y = THREE.MathUtils.lerp(
    weaponRig.rotation.y,
    reloading ? .16 : ads ? 0 : -.03,
    1-Math.exp(-15*delta)
  );

  weaponRoot.position.z = weaponKick;
}

/* =========================================================
   MOVEMENT
========================================================= */

let joystickX = 0;
let joystickY = 0;

function updateMovement(delta) {
  let forward = 0;
  let side = 0;

  if (keys.KeyW) forward++;
  if (keys.KeyS) forward--;
  if (keys.KeyA) side--;
  if (keys.KeyD) side++;

  forward += -joystickY;
  side += joystickX;

  const length = Math.hypot(forward,side);
  if (length > 1) {
    forward /= length;
    side /= length;
  }

  const speed = reloading ? 1.8 : ads ? 2.35 : 3.85;

  const fx = -Math.sin(yaw);
  const fz = -Math.cos(yaw);
  const rx = Math.cos(yaw);
  const rz = -Math.sin(yaw);

  player.x += (fx*forward + rx*side) * speed * delta;
  player.z += (fz*forward + rz*side) * speed * delta;
}

/* =========================================================
   UI MESSAGE
========================================================= */

let messageTimer = null;

function showMessage(text) {
  messageEl.textContent = text;
  messageEl.classList.add('show');

  clearTimeout(messageTimer);
  messageTimer = setTimeout(()=>{
    messageEl.classList.remove('show');
  },950);
}

/* =========================================================
   BULLET HOLES / RAYCASTING
========================================================= */

const raycaster = new THREE.Raycaster();
const shotPoint = new THREE.Vector2();

const holes = [];

const targetHoleMat = new THREE.MeshBasicMaterial({
  color:0x17100d,
  side:THREE.DoubleSide,
  depthWrite:false,
  polygonOffset:true,
  polygonOffsetFactor:-8
});

const wallHoleMat = new THREE.MeshBasicMaterial({
  color:0x201511,
  side:THREE.DoubleSide,
  depthWrite:false,
  polygonOffset:true,
  polygonOffsetFactor:-8
});

function makeHole(hit,onTarget) {
  const hole = new THREE.Mesh(
    new THREE.CircleGeometry(onTarget ? .032 : .025,20),
    onTarget ? targetHoleMat : wallHoleMat
  );

  hole.position.copy(hit.point);

  let normal = new THREE.Vector3(0,0,1);
  if (hit.face) {
    normal = hit.face.normal.clone();
    normal.transformDirection(hit.object.matrixWorld);
  }

  hole.quaternion.setFromUnitVectors(
    new THREE.Vector3(0,0,1),
    normal
  );

  hole.position.addScaledVector(normal,.006);
  hole.renderOrder = 50;
  scene.add(hole);

  holes.push(hole);
  if (holes.length > 220) {
    scene.remove(holes.shift());
  }
}

/* =========================================================
   CASINGS
========================================================= */

const casings = [];

function ejectCasing() {
  const casing = new THREE.Mesh(
    new THREE.CylinderGeometry(.009,.009,.035,14),
    brassMat
  );

  casing.rotation.x = Math.PI/2;

  const p = new THREE.Vector3();
  ejectAnchor.getWorldPosition(p);
  casing.position.copy(p);

  scene.add(casing);

  const velocity = new THREE.Vector3(
    .9 + Math.random()*.25,
    1.15 + Math.random()*.3,
    .1 + Math.random()*.2
  );
  velocity.applyQuaternion(camera.quaternion);

  casings.push({
    mesh:casing,
    velocity,
    spin:new THREE.Vector3(14,18,12),
    life:1.5
  });
}

/* =========================================================
   SIMPLE WEB AUDIO
========================================================= */

let audioCtx = null;

function ensureAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function noiseBurst(duration=.04,volume=.45,frequency=900) {
  ensureAudio();

  const length = Math.ceil(audioCtx.sampleRate*duration);
  const buffer = audioCtx.createBuffer(1,length,audioCtx.sampleRate);
  const data = buffer.getChannelData(0);

  for (let i=0;i<length;i++) data[i] = Math.random()*2-1;

  const src = audioCtx.createBufferSource();
  src.buffer = buffer;

  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = frequency;

  const gain = audioCtx.createGain();
  const now = audioCtx.currentTime;

  gain.gain.setValueAtTime(volume,now);
  gain.gain.exponentialRampToValueAtTime(.001,now+duration);

  src.connect(filter);
  filter.connect(gain);
  gain.connect(audioCtx.destination);

  src.start(now);
  src.stop(now+duration);
}

function soundShot() {
  noiseBurst(.025,.9,2200);
  setTimeout(()=>noiseBurst(.07,.28,620),7);
}

function soundClick() {
  noiseBurst(.018,.16,3400);
}

/* =========================================================
   FIRING
========================================================= */

let muzzleTimer = 0;
let slideKickTimer = 0;

function fire() {
  if (reloading) return;

  ensureAudio();

  if (player.ammo <= 0) {
    soundClick();
    showMessage('MAG EMPTY • RELOAD REQUIRED');
    return;
  }

  player.ammo--;
  ammoText.textContent = player.ammo;

  soundShot();

  muzzleTimer = .045;
  muzzleFlash.visible = true;
  muzzleLight.intensity = 7;

  slideKickTimer = .08;
  weaponKick = ads ? .032 : .052;

  recoilPitch += ads
    ? .008 + Math.random()*.003
    : .018 + Math.random()*.005;

  recoilYaw += (Math.random()-.5) * (ads ? .003 : .007);

  ejectCasing();

  const spread = ads ? 4 : 34;
  const a = Math.random()*Math.PI*2;
  const r = Math.sqrt(Math.random())*spread;

  shotPoint.set(
    Math.cos(a)*r/window.innerWidth*2,
    -Math.sin(a)*r/window.innerHeight*2
  );

  raycaster.setFromCamera(shotPoint,camera);

  const hittables = [
    ...targetSurface.children,
    targetBoard,
    wall,
    ground
  ];

  const hits = raycaster.intersectObjects(hittables,false);

  if (hits.length) {
    const hit = hits[0];
    const onTarget =
      targetSurface.children.includes(hit.object) ||
      hit.object === targetBoard;

    if (hit.object !== ground) {
      makeHole(hit,onTarget);
    }

    if (onTarget) scoreHit(hit.point);
  }
}

function scoreHit(point) {
  const localPoint = point.clone();
  target.worldToLocal(localPoint);

  const d = Math.hypot(localPoint.x,localPoint.y);

  let points = 1;
  if (d <= .20) points = 10;
  else if (d <= .40) points = 8;
  else if (d <= .63) points = 6;
  else if (d <= .86) points = 4;
  else if (d <= 1.10) points = 2;

  player.score += points;
  scoreText.textContent = player.score;

  hitMarker.style.display = 'block';
  setTimeout(()=>hitMarker.style.display='none',90);
}

/* =========================================================
   RELOAD
========================================================= */

let reloading = false;
let reloadStart = 0;
const reloadDuration = 3.45;

const magInsertedY = -.20;
const magAlignY = -.48;

function startReload() {
  if (reloading || player.ammo === 12) return;

  setADS(false);
  reloading = true;
  reloadStart = performance.now()/1000;
  modeText.textContent = 'RELOADING';

  oldMagazine.visible = true;
  oldMagazine.position.set(0,magInsertedY,.03);

  freshMagazine.visible = false;
  freshMagazine.position.set(0,-.70,.03);

  reloadHand.visible = true;
  reloadHand.position.set(-.34,-.82,.08);
}

function ease(t) {
  t = THREE.MathUtils.clamp(t,0,1);
  return t*t*(3-2*t);
}

function reloadLerp(obj,a,b,p) {
  obj.position.lerpVectors(a,b,ease(p));
}

function updateReload() {
  if (!reloading) return;

  const t = performance.now()/1000 - reloadStart;

  const hidden = new THREE.Vector3(-.34,-.82,.08);
  const oldGrab = new THREE.Vector3(-.08,-.34,.06);
  const rip = new THREE.Vector3(-.14,-.57,.05);
  const throwPos = new THREE.Vector3(-.48,-.48,.05);
  const freshGrab = new THREE.Vector3(-.14,-.64,.05);
  const align = new THREE.Vector3(-.07,-.47,.03);
  const seat = new THREE.Vector3(-.04,-.23,.03);
  const slideFront = new THREE.Vector3(-.07,.12,-.22);
  const slideRear = new THREE.Vector3(-.16,.09,.02);

  if (t < .30) {
    reloadLerp(reloadHand,hidden,oldGrab,t/.30);
  }
  else if (t < .66) {
    const p = (t-.30)/.36;
    reloadLerp(reloadHand,oldGrab,rip,p);
    oldMagazine.position.y = THREE.MathUtils.lerp(magInsertedY,-.50,ease(p));
  }
  else if (t < .88) {
    const p = (t-.66)/.22;
    reloadLerp(reloadHand,rip,throwPos,p);
    oldMagazine.visible = false;
  }
  else if (t < 1.15) {
    reloadLerp(reloadHand,throwPos,hidden,(t-.88)/.27);
  }
  else if (t < 1.48) {
    const p = (t-1.15)/.33;
    freshMagazine.visible = true;
    reloadLerp(reloadHand,hidden,freshGrab,p);
    freshMagazine.position.set(
      THREE.MathUtils.lerp(-.1,0,ease(p)),
      THREE.MathUtils.lerp(-.70,-.56,ease(p)),
      .03
    );
  }
  else if (t < 1.80) {
    const p = (t-1.48)/.32;
    reloadLerp(reloadHand,freshGrab,align,p);
    freshMagazine.position.set(
      THREE.MathUtils.lerp(-.03,0,ease(p)),
      THREE.MathUtils.lerp(-.56,magAlignY,ease(p)),
      .03
    );
  }
  else if (t < 2.23) {
    const p = (t-1.80)/.43;
    reloadLerp(reloadHand,align,seat,p);

    // The magazine visibly travels all the way into the grip.
    freshMagazine.position.set(
      0,
      THREE.MathUtils.lerp(magAlignY,magInsertedY,ease(p)),
      .03
    );

    weaponTilt =
      Math.sin(ease(p)*Math.PI*7) *
      .025 *
      (1-ease(p));
  }
  else if (t < 2.50) {
    freshMagazine.position.set(0,magInsertedY,.03);
    reloadLerp(reloadHand,seat,slideFront,(t-2.23)/.27);
  }
  else if (t < 2.84) {
    freshMagazine.position.set(0,magInsertedY,.03);
    reloadLerp(reloadHand,slideFront,slideRear,(t-2.50)/.34);

    // Generic visual rack: move entire weapon visual a little.
    weaponVisual.position.z = THREE.MathUtils.lerp(
      0,
      .10,
      ease((t-2.50)/.34)
    );
  }
  else if (t < 3.00) {
    freshMagazine.position.set(0,magInsertedY,.03);
    weaponVisual.position.z = THREE.MathUtils.lerp(
      .10,
      0,
      ease((t-2.84)/.16)
    );
  }
  else if (t < reloadDuration) {
    freshMagazine.position.set(0,magInsertedY,.03);
    reloadLerp(reloadHand,slideRear,hidden,(t-3.00)/(reloadDuration-3.00));
  }
  else {
    finishReload();
  }
}

function finishReload() {
  reloading = false;

  oldMagazine.visible = false;
  freshMagazine.visible = false;
  reloadHand.visible = false;

  weaponVisual.position.set(0,0,0);
  weaponTilt = 0;

  player.ammo = 12;
  ammoText.textContent = 12;
  modeText.textContent = 'HIP FIRE';
}

/* =========================================================
   RECOIL / EFFECT UPDATES
========================================================= */

function updateEffects(delta) {
  recoilPitch = THREE.MathUtils.lerp(
    recoilPitch,
    0,
    1-Math.exp(-9*delta)
  );

  recoilYaw = THREE.MathUtils.lerp(
    recoilYaw,
    0,
    1-Math.exp(-10*delta)
  );

  weaponKick = THREE.MathUtils.lerp(
    weaponKick,
    0,
    1-Math.exp(-13*delta)
  );

  if (muzzleTimer > 0) {
    muzzleTimer -= delta;
    const s = .8 + Math.random()*.35;
    muzzleFlash.scale.set(.26*s,.26*s,.26*s);
    muzzleFlash.material.rotation = Math.random()*Math.PI;
    muzzleLight.intensity = 5 + Math.random()*3;
  } else {
    muzzleFlash.visible = false;
    muzzleLight.intensity = 0;
  }

  if (slideKickTimer > 0) {
    slideKickTimer -= delta;

    // Fallback slide animates separately if present.
    if (fallbackWeapon && fallbackWeapon.userData.slide) {
      fallbackWeapon.userData.slide.position.z =
        -.16 + Math.sin((slideKickTimer/.08)*Math.PI)*.10;
    }
  } else if (fallbackWeapon && fallbackWeapon.userData.slide) {
    fallbackWeapon.userData.slide.position.z = -.16;
  }

  weaponTilt = THREE.MathUtils.lerp(
    weaponTilt,
    0,
    1-Math.exp(-12*delta)
  );
}

/* =========================================================
   LOOSE OBJECTS
========================================================= */

function updateCasings(delta) {
  for (let i=casings.length-1;i>=0;i--) {
    const c = casings[i];

    c.velocity.y -= 6.2*delta;
    c.mesh.position.addScaledVector(c.velocity,delta);

    c.mesh.rotation.x += c.spin.x*delta;
    c.mesh.rotation.y += c.spin.y*delta;
    c.mesh.rotation.z += c.spin.z*delta;

    c.life -= delta;

    if (c.life <= 0) {
      scene.remove(c.mesh);
      casings.splice(i,1);
    }
  }
}

/* =========================================================
   MOBILE LOOK
========================================================= */

let lookTouch = null;
let touchX = 0;
let touchY = 0;

renderer.domElement.addEventListener('touchstart',e=>{
  for (const touch of e.changedTouches) {
    if (touch.clientX > window.innerWidth*.34) {
      lookTouch = touch.identifier;
      touchX = touch.clientX;
      touchY = touch.clientY;
      break;
    }
  }
},{passive:false});

renderer.domElement.addEventListener('touchmove',e=>{
  for (const touch of e.changedTouches) {
    if (touch.identifier === lookTouch) {
      const dx = touch.clientX-touchX;
      const dy = touch.clientY-touchY;

      yaw -= dx*.006;
      pitch -= dy*.006;

      pitch = THREE.MathUtils.clamp(
        pitch,
        -Math.PI/2+.015,
        Math.PI/2-.015
      );

      touchX = touch.clientX;
      touchY = touch.clientY;
      e.preventDefault();
    }
  }
},{passive:false});

/* =========================================================
   MOBILE JOYSTICK
========================================================= */

const joystick = document.getElementById('joystick');
const stick = document.getElementById('stick');

let joystickTouch = null;

function moveJoystick(touch) {
  const rect = joystick.getBoundingClientRect();

  let x = touch.clientX-rect.left-60;
  let y = touch.clientY-rect.top-60;

  const len = Math.hypot(x,y);

  if (len > 40) {
    x = x/len*40;
    y = y/len*40;
  }

  joystickX = x/40;
  joystickY = y/40;

  stick.style.left = `${35+x}px`;
  stick.style.top = `${35+y}px`;
}

joystick.addEventListener('touchstart',e=>{
  const touch = e.changedTouches[0];
  joystickTouch = touch.identifier;
  moveJoystick(touch);
  e.preventDefault();
},{passive:false});

joystick.addEventListener('touchmove',e=>{
  for (const touch of e.changedTouches) {
    if (touch.identifier === joystickTouch) {
      moveJoystick(touch);
      e.preventDefault();
    }
  }
},{passive:false});

joystick.addEventListener('touchend',()=>{
  joystickTouch = null;
  joystickX = 0;
  joystickY = 0;
  stick.style.left = '35px';
  stick.style.top = '35px';
});

/* =========================================================
   MOBILE FIRE / ADS
========================================================= */

document.getElementById('fireButton').addEventListener('touchstart',e=>{
  e.preventDefault();
  fire();
},{passive:false});

const adsButton = document.getElementById('adsButton');

adsButton.addEventListener('touchstart',e=>{
  e.preventDefault();
  setADS(true);
},{passive:false});

adsButton.addEventListener('touchend',e=>{
  e.preventDefault();
  setADS(false);
},{passive:false});

/* =========================================================
   RESIZE
========================================================= */

window.addEventListener('resize',()=>{
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  renderer.setSize(window.innerWidth,window.innerHeight);

  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
});

/* =========================================================
   GAME LOOP
========================================================= */

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);

  const delta = Math.min(clock.getDelta(),.033);

  updateMovement(delta);
  updateReload();
  updateEffects(delta);
  updateCamera(delta);
  updateWeapon(delta);
  updateCasings(delta);

  renderer.render(scene,camera);
}

animate();

</script>
