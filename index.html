#crosshair{position:fixed;left:50%;top:50%;width:32px;height:32px;transform:translate(-50%,-50%);z-index:32;pointer-events:none;transition:transform .12s ease,opacity .12s ease}.cross{position:absolute;background:#fff;box-shadow:0 0 2px #000,0 0 5px rgba(0,0,0,.85)}.ct{width:2px;height:7px;left:15px;top:0}.cb{width:2px;height:7px;left:15px;bottom:0}.cl{width:7px;height:2px;left:0;top:15px}.cr{width:7px;height:2px;right:0;top:15px}.dot{position:absolute;left:14px;top:14px;width:4px;height:4px;border-radius:50%;background:#ff3434;box-shadow:0 0 3px #000}body.ads #crosshair{transform:translate(-50%,-50%) scale(.64);opacity:.82}body.rifleAds #crosshair{opacity:0}

#joystick{position:fixed;left:24px;bottom:28px;width:120px;height:120px;border-radius:50%;z-index:30;border:2px solid rgba(255,255,255,.34);background:rgba(0,0,0,.20)}#stick{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.72)}
#fireButton,#adsButton,#jumpButton{position:fixed;z-index:30;border-radius:50%;border:2px solid rgba(255,255,255,.42);color:#fff;font-weight:800}#fireButton{right:25px;bottom:31px;width:90px;height:90px;background:rgba(170,28,28,.82)}#adsButton{right:45px;bottom:138px;width:66px;height:66px;background:rgba(28,45,34,.78)}#jumpButton{right:125px;bottom:52px;width:62px;height:62px;background:rgba(45,71,101,.78)}
@media(pointer:fine){#joystick,#fireButton,#adsButton,#jumpButton{display:none}}@media(pointer:coarse){#controls,#prompt{display:none}}
</style>

import * as THREE from 'three';

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.02;game.appendChild(renderer.domElement);

const sky=new THREE.Mesh(new THREE.SphereGeometry(180,64,36),new THREE.ShaderMaterial({side:THREE.BackSide,uniforms:{topColor:{value:new THREE.Color(0x4b9fd9)},midColor:{value:new THREE.Color(0x8ec9e8)},lowColor:{value:new THREE.Color(0xe7f2e8)}},vertexShader:`varying vec3 vWorld;void main(){vec4 wp=modelMatrix*vec4(position,1.0);vWorld=wp.xyz;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,fragmentShader:`uniform vec3 topColor;uniform vec3 midColor;uniform vec3 lowColor;varying vec3 vWorld;void main(){float h=normalize(vWorld).y*.5+.5;vec3 c=mix(lowColor,midColor,smoothstep(.30,.62,h));c=mix(c,topColor,smoothstep(.58,1.0,h));gl_FragColor=vec4(c,1.0);}`}));

  const g=new THREE.BufferGeometry();
  const v=new Float32Array([
    -.018,0,0, .018,0,0, .010,.24,0, -.010,.24,0,
    0,0,-.018, 0,0,.018, 0,.24,.010, 0,.24,-.010

const bladeGeo=grassBladeGeo();

for(let i=0;i<300;i++)tuft((Math.random()-.5)*34,-2-Math.random()*26,.75+Math.random()*.85);

hill(-34,-62,28,9,15,0x638351);hill(3,-72,35,11,20,0x668a56);hill(43,-63,27,8,16,0x5c7c4b);

const concreteMat=new THREE.MeshStandardMaterial({color:0xaaa79d,roughness:.94}),darkConcreteMat=new THREE.MeshStandardMaterial({color:0x74736e,roughness:.96}),woodMat=new THREE.MeshStandardMaterial({color:0x755136,roughness:.9});

for(const x of[-8.25,8.25]){const s=new THREE.Mesh(new THREE.BoxGeometry(2.7,4.2,.55),concreteMat);s.position.set(x,2.1,-20.75);s.rotation.y=x<0?-.22:.22;s.castShadow=s.receiveShadow=true;scene.add(s)}
for(const x of[-5.2,5.2]){const b=new THREE.Mesh(new THREE.BoxGeometry(2.8,.17,1),woodMat);b.position.set(x,.88,-7.5);b.castShadow=true;scene.add(b);for(const sx of[-1,1]){const l=new THREE.Mesh(new THREE.BoxGeometry(.14,.82,.14),darkConcreteMat);l.position.set(x+sx*1.05,.42,-7.5);l.castShadow=true;scene.add(l)}}

const target=new THREE.Group();target.position.set(0,2.85,-19.7);scene.add(target);
const board=new THREE.Mesh(new THREE.BoxGeometry(3.25,3.25,.09),new THREE.MeshStandardMaterial({color:0xe5e0d4,roughness:.84}));board.castShadow=board.receiveShadow=true;target.add(board);
const targetSurface=new THREE.Group();targetSurface.position.z=.052;target.add(targetSurface);
[[1.35,0xf2efe8],[1.10,0x252628],[.86,0xf2efe8],[.63,0xc73932],[.40,0xf2efe8],[.20,0xd92521]].forEach(([r,c],i)=>{const m=new THREE.Mesh(new THREE.CircleGeometry(r,96),new THREE.MeshStandardMaterial({color:c,roughness:.83,side:THREE.DoubleSide}));m.position.z=i*.0015;targetSurface.add(m)});
for(const x of[-1.05,1.05]){const p=new THREE.Mesh(new THREE.BoxGeometry(.12,2.05,.12),woodMat);p.position.set(x,-2.58,-.1);p.castShadow=true;target.add(p)}

[[-11,-25,1.15],[11,-25,1.15],[-17,-33,1.45],[18,-34,1.35],[-23,-43,1.65],[24,-44,1.55],[-31,-28,1.25],[32,-31,1.35],[-38,-46,1.45],[39,-47,1.55]].forEach(v=>tree(...v));

const weaponRig=new THREE.Group();camera.add(weaponRig);const weaponRoot=new THREE.Group();weaponRig.add(weaponRoot);const weaponVisual=new THREE.Group();weaponRoot.add(weaponVisual);const fxRoot=new THREE.Group();weaponRoot.add(fxRoot);
let realWeapon=null,realModelLoaded=false,fallbackWeapon=null,activeSlideObject=null;const MODEL_PATH='./models/pistol.glb';

function makeFallback(){const g=new THREE.Group(),sg=new THREE.Group();g.add(sg);const sl=extrude2D(slideShape(),.068,slideMat,.006);sl.position.set(0,.092,-.18);sg.add(sl);const fr=extrude2D(frameShape(),.062,polymerMat,.005);fr.position.set(0,-.052,-.005);g.add(fr);const ba=new THREE.Mesh(new THREE.CylinderGeometry(.034,.034,.50,40),darkMetal);ba.rotation.x=Math.PI/2;ba.position.set(0,.093,-.285);g.add(ba);const mu=new THREE.Mesh(new THREE.TorusGeometry(.036,.006,16,40),darkMetal);mu.position.set(0,.093,-.548);g.add(mu);const bo=new THREE.Mesh(new THREE.CircleGeometry(.027,32),new THREE.MeshBasicMaterial({color:0}));bo.position.set(0,.093,-.557);g.add(bo);const ep=new THREE.Mesh(new THREE.BoxGeometry(.06,.005,.112),new THREE.MeshStandardMaterial({color:0x020303,roughness:.8}));ep.position.set(.034,.165,-.115);sg.add(ep);for(let i=0;i<7;i++){const se=new THREE.Mesh(new THREE.BoxGeometry(.003,.06,.008),darkMetal);se.position.set(.034,.10,.025+i*.018);sg.add(se)}const fs=new THREE.Mesh(new THREE.BoxGeometry(.02,.034,.034),darkMetal);fs.position.set(0,.185,-.455);sg.add(fs);for(const x of[-.035,.035]){const rs=new THREE.Mesh(new THREE.BoxGeometry(.022,.036,.032),darkMetal);rs.position.set(x,.187,.042);sg.add(rs)}

const tp=new THREE.Group();

  new THREE.CapsuleGeometry(.0065,.044,8,16),

new GLTFLoader().load(MODEL_PATH,g=>{
  realWeapon=g.scene;
  orientModel(realWeapon);
  weaponVisual.add(realWeapon);
  fallbackWeapon.visible=false;

  let foundSlide=null;
  realWeapon.traverse(o=>{

  });

  fallbackWeapon.visible=true;
  realModelLoaded=false;
  activeSlideObject=fallbackWeapon.userData.slideGroup;

});

const oldMagazine=magazine(),freshMagazine=magazine();oldMagazine.visible=freshMagazine.visible=false;weaponRoot.add(oldMagazine,freshMagazine);const reloadHand=new THREE.Mesh(new THREE.SphereGeometry(1,36,28),skinMat);reloadHand.scale.set(.09,.13,.08);reloadHand.visible=false;weaponRoot.add(reloadHand);

const BASE_EYE=1.68,WALK=3.9,SPRINT=WALK*2,ADS_SPEED=2.35,RELOAD_SPEED=1.8,GRAVITY=18.5,JUMP_V=6.6,player={x:0,z:1,eyeHeight:BASE_EYE,ammo:12,score:0,verticalVelocity:0,grounded:true},keys={};
let yaw=0,pitch=0,ads=false,pointerLocked=false,currentFov=72,targetFov=72,recoilPitch=0,recoilYaw=0,weaponKick=0,weaponTilt=0;const mouseSensitivity=.00225;

function updatePistolReload(){
  if(!reloading)return;

  const t=performance.now()/1000-reloadStart;

  // The hand now goes far below the camera-relative weapon rig.
  // Since the gun is attached to the camera, this stays offscreen even when looking down.
  const hidden=new THREE.Vector3(-.36,-1.72,.12);
  const oldGrab=new THREE.Vector3(-.08,-.34,.06);
  const rip=new THREE.Vector3(-.16,-.61,.06);
  const throwPos=new THREE.Vector3(-.72,-.56,.02);
  const freshHidden=new THREE.Vector3(-.26,-1.70,.10);
  const freshRise=new THREE.Vector3(-.15,-.69,.06);
  const align=new THREE.Vector3(-.07,-.48,.03);
  const seat=new THREE.Vector3(-.04,-.23,.03);
  const slideFront=new THREE.Vector3(-.08,.14,-.20);
  const slideRear=new THREE.Vector3(-.18,.11,.02);

  if(t<.30){
    rl(reloadHand,hidden,oldGrab,t/.30);
  }

  else if(t<.66){
    const p=(t-.30)/.36;
    rl(reloadHand,oldGrab,rip,p);
    oldMagazine.position.y=THREE.MathUtils.lerp(magInsertedY,-.54,ease(p));
    oldMagazine.position.x=THREE.MathUtils.lerp(0,-.05,ease(p));
    if(p<.07)soundMag();
  }

  else if(t<.90){
    const p=(t-.66)/.24;
    rl(reloadHand,rip,throwPos,p);

    oldMagazine.visible=true;
    oldMagazine.position.set(
      THREE.MathUtils.lerp(-.05,-.72,ease(p)),
      THREE.MathUtils.lerp(-.54,-.66,ease(p)),
      THREE.MathUtils.lerp(.03,.01,ease(p))
    );
    oldMagazine.rotation.z=THREE.MathUtils.lerp(0,-1.25,ease(p));
  }

  else if(t<1.28){
    const p=(t-.90)/.38;
    oldMagazine.visible=false;
    rl(reloadHand,throwPos,hidden,p);
  }

  // A short beat where the hand is entirely gone.
  else if(t<1.46){
    reloadHand.position.copy(hidden);
    reloadHand.visible=false;
    freshMagazine.visible=false;
  }

  // The hand comes back from fully below frame already holding the fresh mag.
  else if(t<1.84){
    const p=(t-1.46)/.38;
    reloadHand.visible=true;
    freshMagazine.visible=true;

    rl(reloadHand,freshHidden,freshRise,p);

    freshMagazine.position.set(
      THREE.MathUtils.lerp(-.12,-.07,ease(p)),
      THREE.MathUtils.lerp(-1.58,-.68,ease(p)),
      THREE.MathUtils.lerp(.08,.04,ease(p))
    );
  }

  else if(t<2.16){
    const p=(t-1.84)/.32;
    rl(reloadHand,freshRise,align,p);

    freshMagazine.position.set(
      THREE.MathUtils.lerp(-.07,0,ease(p)),
      THREE.MathUtils.lerp(-.68,magAlignY,ease(p)),
      THREE.MathUtils.lerp(.04,.03,ease(p))
    );

    freshMagazine.rotation.z=
      Math.sin(ease(p)*Math.PI*4)*.055*(1-ease(p));
  }

  else if(t<2.58){
    const p=(t-2.16)/.42;
    rl(reloadHand,align,seat,p);

    // Visible shove all the way into the grip.
    freshMagazine.position.set(
      0,
      THREE.MathUtils.lerp(magAlignY,magInsertedY,ease(p)),
      .03
    );

    freshMagazine.rotation.z=
      Math.sin(ease(p)*Math.PI*5)*.025*(1-ease(p));

    weaponTilt=
      Math.sin(ease(p)*Math.PI*7)*.022*(1-ease(p));

    if(p>.90&&p<.94)soundMag();
  }

  else if(t<2.86){
    freshMagazine.position.set(0,magInsertedY,.03);
    rl(reloadHand,seat,slideFront,(t-2.58)/.28);
  }

  // Slide-only rack. The weapon root never moves backward.
  else if(t<3.20){
    const p=(t-2.86)/.34;
    freshMagazine.position.set(0,magInsertedY,.03);
    rl(reloadHand,slideFront,slideRear,p);

    if(activeSlideObject){
      activeSlideObject.position.z=THREE.MathUtils.lerp(0,.145,ease(p));
    }

    if(p<.06)soundRack();
  }

  else if(t<3.38){
    const p=(t-3.20)/.18;
    freshMagazine.position.set(0,magInsertedY,.03);

    if(activeSlideObject){
      activeSlideObject.position.z=THREE.MathUtils.lerp(.145,0,ease(p));
    }
  }

  else if(t<3.90){
    freshMagazine.position.set(0,magInsertedY,.03);
    rl(reloadHand,slideRear,hidden,(t-3.38)/.52);
  }

  else{
    finishPistolReload();
  }
}

function addBoxCollider(x,z,w,d,name){solidColliders.push({type:'box',x,z,hw:w/2,hd:d/2,name})}
function addCircleCollider(x,z,r,name){solidColliders.push({type:'circle',x,z,r,name})}

function collidesAt(x,z){
  for(const c of solidColliders){
    if(c.type==='box'){
      if(
        x+PLAYER_HALF_X>c.x-c.hw &&
        x-PLAYER_HALF_X<c.x+c.hw &&
        z+PLAYER_HALF_Z>c.z-c.hd &&
        z-PLAYER_HALF_Z<c.z+c.hd
      ) return true;
    }else{
      const nx=Math.max(c.x-0,x-PLAYER_HALF_X,Math.min(c.x+0,x+PLAYER_HALF_X));
      const nz=Math.max(c.z-0,z-PLAYER_HALF_Z,Math.min(c.z+0,z+PLAYER_HALF_Z));
      // Circle vs player rectangle via closest rectangle point to circle center.
      const cx=Math.max(x-PLAYER_HALF_X,Math.min(c.x,x+PLAYER_HALF_X));
      const cz=Math.max(z-PLAYER_HALF_Z,Math.min(c.z,z+PLAYER_HALF_Z));
      const dx=c.x-cx,dz=c.z-cz;
      if(dx*dx+dz*dz<c.r*c.r) return true;
    }
  }
  return false;
}

function movePlayerWithCollision(dx,dz){
  const nx=player.x+dx;
  if(!collidesAt(nx,player.z)) player.x=nx;

  const nz=player.z+dz;
  if(!collidesAt(player.x,nz)) player.z=nz;
}

function makePlayerWeaponHand(){

      new THREE.CapsuleGeometry(.018,.080,8,14),
      skinMat
    );

      .050,

};

function updatePlayerWeaponHand(dt){
  const pose=currentWeapon==='rifle'?rifleHandPose:pistolHandPose;
  const blend=1-Math.exp(-18*dt);

  let targetPos=pose.position.clone();

  /*
    For the rifle, derive the hand position from the actual
    rifle pistol-grip location so it stays attached if ADS
    alignment shifts the rifle.
  */
  if(currentWeapon==='rifle'&&heldRifle.userData.gripLocal){
    const grip=heldRifle.userData.gripLocal.clone()
      .multiply(heldRifle.scale)
      .add(heldRifle.position);

    targetPos.set(
      grip.x,
      grip.y+.035,
      grip.z+.060
    );
  }

  playerWeaponHand.position.lerp(targetPos,blend);
  playerWeaponHand.rotation.x=THREE.MathUtils.lerp(
    playerWeaponHand.rotation.x,pose.rotation.x,blend
  );
  playerWeaponHand.rotation.y=THREE.MathUtils.lerp(
    playerWeaponHand.rotation.y,pose.rotation.y,blend
  );
  playerWeaponHand.rotation.z=THREE.MathUtils.lerp(
    playerWeaponHand.rotation.z,pose.rotation.z,blend
  );

  const s=THREE.MathUtils.lerp(
    playerWeaponHand.scale.x||pose.scale,
    pose.scale,
    blend
  );
  playerWeaponHand.scale.setScalar(s);

  /*
    During the pistol reload this is the RIGHT hand that
    continues holding the pistol. reloadHand remains the
    separate LEFT hand used for magazine manipulation.
  */
  playerWeaponHand.visible=true;
}

function getBenchPickupHit(){
  if(!benchWeaponGroup) return false;
  const playerPos=new THREE.Vector3(player.x,player.eyeHeight,player.z);
  const benchPos=new THREE.Vector3();
  benchWeaponGroup.getWorldPosition(benchPos);
  if(playerPos.distanceTo(benchPos)>3.15) return false;

  const r=new THREE.Raycaster();
  r.setFromCamera(new THREE.Vector2(0,0),camera);
  const hits=r.intersectObject(benchWeaponGroup,true);
  return hits.length>0&&hits[0].distance<3.3;
}

let pickupHolding=false;
let pickupHoldStart=0;
const PICKUP_HOLD_TIME=.55;
let fireHeld=false;
let lastRifleShot=-999;
let rifleFlashTimer=0;
let rifleReloadStart=0;
const RIFLE_RELOAD_TIME=2.55;

function beginPickupHold(){
  pickupHolding=true;
  pickupHoldStart=performance.now()/1000;
}

function cancelPickupHold(){
  pickupHolding=false;
}

function swapBenchWeapon(){
  weaponAmmo[currentWeapon]=player.ammo;

  const oldHeld=currentWeapon;
  currentWeapon=benchWeaponType;
  benchWeaponType=oldHeld;

  // Stop transient weapon states before swapping.
  reloading=false;
  sprinting=false;
  setADS(false);

  syncHeldWeapon();
  rebuildBenchWeapon();
  showMessage(currentWeapon==='rifle'?'ASSAULT RIFLE EQUIPPED':'PISTOL EQUIPPED');
  pickupHolding=false;
}

function updatePickupInteraction(){
  const looking=getBenchPickupHit();

  if(looking&&!pickupHolding){
    pickupPrompt.textContent=`HOLD LEFT CLICK TO SWAP FOR ${benchWeaponType==='rifle'?'ASSAULT RIFLE':'PISTOL'}`;
    pickupPrompt.classList.add('show');
  }else if(!pickupHolding){
    pickupPrompt.classList.remove('show');
  }

  if(pickupHolding){
    if(!fireHeld||!looking){
      cancelPickupHold();
      pickupPrompt.classList.remove('show');
      return;
    }

    const p=(performance.now()/1000-pickupHoldStart)/PICKUP_HOLD_TIME;
    pickupPrompt.textContent=`SWAPPING… ${Math.min(100,Math.floor(p*100))}%`;
    pickupPrompt.classList.add('show');

    if(p>=1){
      pickupPrompt.classList.remove('show');
      swapBenchWeapon();
    }
  }
}

function rifleShot(){
  if(reloading||sprinting||currentWeapon!=='rifle') return;

  if(player.ammo<=0){
    soundClick();
    showMessage('MAG EMPTY • RELOAD REQUIRED');
    return;
  }

  player.ammo--;
  weaponAmmo.rifle=player.ammo;
  ammoText.textContent=player.ammo;

  soundShot();
  rifleFlash.visible=true;
  rifleMuzzleLight.intensity=8;
  rifleFlashTimer=.04;

  weaponKick=ads?.027:.045;
  recoilPitch+=ads?.0065:.012;
  recoilYaw+=(Math.random()-.5)*(ads?.0025:.0055);

  // Rifle casing.
  const casing=new THREE.Mesh(
    new THREE.CylinderGeometry(.008,.008,.032,12),brassMat
  );
  casing.rotation.x=Math.PI/2;
  const cp=new THREE.Vector3();
  rifleEjectAnchor.getWorldPosition(cp);
  casing.position.copy(cp);
  scene.add(casing);
  const cv=new THREE.Vector3(.95+Math.random()*.3,1.05+Math.random()*.35,.08+Math.random()*.18);
  cv.applyQuaternion(camera.quaternion);
  casings.push({mesh:casing,velocity:cv,spin:new THREE.Vector3(16,20,14),life:1.45});

  const spread=ads?1.4:25;
  const a=Math.random()*Math.PI*2,r=Math.sqrt(Math.random())*spread;
  shotPoint.set(Math.cos(a)*r/innerWidth*2,-Math.sin(a)*r/innerHeight*2);
  raycaster.setFromCamera(shotPoint,camera);
  const hits=raycaster.intersectObjects([...targetSurface.children,board,wall,ground],false);
  if(hits.length){
    const hit=hits[0];
    const onTarget=targetSurface.children.includes(hit.object)||hit.object===board;
    if(hit.object!==ground)hole(hit,onTarget);
    if(onTarget)scoreHit(hit.point);
  }
}

function fire(){
  if(getBenchPickupHit()){
    beginPickupHold();
    return;
  }
  if(currentWeapon==='rifle'){
    rifleShot();
    lastRifleShot=performance.now()/1000;
  }else{
    firePistol();
    weaponAmmo.pistol=player.ammo;
  }
}

function startReload(){
  if(currentWeapon==='pistol'){
    startPistolReload();
    return;
  }

  if(reloading||sprinting||player.ammo===RIFLE_MAG_SIZE) return;
  setADS(false);
  reloading=true;
  rifleReloadStart=performance.now()/1000;
}

function updateReload(){
  if(currentWeapon==='pistol'){
    updatePistolReload();
    weaponAmmo.pistol=player.ammo;
    return;
  }

  if(!reloading) return;
  const t=performance.now()/1000-rifleReloadStart;

  const mag=heldRifle.userData.magazine;
  const magLower=heldRifle.userData.magazineLower;
  const magBase=heldRifle.userData.magazineBase;

  const moveMagazineParts=(dy,visible=true)=>{
    mag.visible=magLower.visible=magBase.visible=visible;
    mag.position.y=-.22+dy;
    magLower.position.y=-.385+dy;
    magBase.position.y=-.475+dy;
  };

  if(t<.55){
    const dy=THREE.MathUtils.lerp(0,-.30,ease(t/.55));
    moveMagazineParts(dy,true);
  }else if(t<1.15){
    moveMagazineParts(-.30,false);
  }else if(t<1.70){
    const dy=THREE.MathUtils.lerp(-.30,0,ease((t-1.15)/.55));
    moveMagazineParts(dy,true);
  }

  if(t>=RIFLE_RELOAD_TIME){
    moveMagazineParts(0,true);
    player.ammo=RIFLE_MAG_SIZE;
    weaponAmmo.rifle=RIFLE_MAG_SIZE;
    ammoText.textContent=player.ammo;
    reloading=false;
  }
}

// Collision-aware movement override, preserving sprint and jump physics.
updateMovement=function(dt){
  let f=0,s=0;
  if(keys.KeyW)f++;
  if(keys.KeyS)f--;
  if(keys.KeyA)s--;
  if(keys.KeyD)s++;
  f+=-joystickY;
  s+=joystickX;

  let l=Math.hypot(f,s);
  if(l>1){f/=l;s/=l}
  currentMove=Math.min(1,Math.hypot(f,s));
  updateSprint();

  let sp=WALK;
  if(reloading)sp=RELOAD_SPEED;
  else if(ads)sp=ADS_SPEED;
  else if(sprinting&&f>.1)sp=SPRINT;

  const fx=-Math.sin(yaw),fz=-Math.cos(yaw),rx=Math.cos(yaw),rz=-Math.sin(yaw);
  const dx=(fx*f+rx*s)*sp*dt;
  const dz=(fz*f+rz*s)*sp*dt;
  movePlayerWithCollision(dx,dz);

  if(!player.grounded){
    player.verticalVelocity-=GRAVITY*dt;
    player.eyeHeight+=player.verticalVelocity*dt;
    if(player.eyeHeight<=BASE_EYE){
      player.eyeHeight=BASE_EYE;
      player.verticalVelocity=0;
      player.grounded=true;
    }
  }else player.eyeHeight=BASE_EYE;

  playerColliderVisual.position.set(player.x,0,player.z);
  playerColliderVisual.rotation.y=yaw;
};

// Weapon pose override with mathematically centered rifle optic.
const oldUpdateWeapon=updateWeapon;
updateWeapon=function(dt){
  oldUpdateWeapon(dt);

  if(currentWeapon==='rifle'){
    const blend=1-Math.exp(-18*dt);

    if(ads){
      /*
        Camera center in weaponRoot coordinates.

        The rifle's red dot/optic axis is transformed by:
        weaponRig position + weaponRig scale *
        (heldRifle position + heldRifle scale * opticCenter)

        Solve that equation for heldRifle X/Y so the optic axis
        lands exactly on camera center. This fixes the old
        half-inch-low red dot and makes the dot agree with the
        camera-center bullet ray.
      */
      const rigScale=Math.max(.0001,weaponRig.scale.x);
      const optic=heldRifle.userData.opticCenter||new THREE.Vector3(0,.275,-.105);

      const targetX=
        (-weaponRig.position.x/rigScale) -
        heldRifle.scale.x*optic.x;

      const targetY=
        (-weaponRig.position.y/rigScale) -
        heldRifle.scale.y*optic.y;

      heldRifle.position.x=THREE.MathUtils.lerp(
        heldRifle.position.x,targetX,blend
      );

      heldRifle.position.y=THREE.MathUtils.lerp(
        heldRifle.position.y,targetY,blend
      );

      heldRifle.position.z=THREE.MathUtils.lerp(
        heldRifle.position.z,.015,blend
      );
    }else{
      heldRifle.position.x=THREE.MathUtils.lerp(
        heldRifle.position.x,0,blend
      );
      heldRifle.position.y=THREE.MathUtils.lerp(
        heldRifle.position.y,-.02,blend
      );
      heldRifle.position.z=THREE.MathUtils.lerp(
        heldRifle.position.z,.08,blend
      );
    }
  }

  updatePlayerWeaponHand(dt);
};

const oldUpdateEffects=updateEffects;

  oldUpdateEffects(dt);
  updatePickupInteraction();

  if(rifleFlashTimer>0){
    rifleFlashTimer-=dt;
    const s=.85+Math.random()*.3;
    rifleFlash.scale.set(.32*s,.32*s,.32*s);
    rifleMuzzleLight.intensity=5+Math.random()*4;

    rifleFlash.visible=false;
    rifleMuzzleLight.intensity=0;
  }

  if(
    fireHeld &&
    !pickupHolding &&
    currentWeapon==='rifle' &&
    !reloading &&
    !sprinting
  ){
    const now=performance.now()/1000;
    if(now-lastRifleShot>=RIFLE_SHOT_INTERVAL){
      rifleShot();
      lastRifleShot=now;
    }
  }
};

renderer.domElement.addEventListener('mousedown',e=>{
  if(e.button===0&&document.pointerLockElement===renderer.domElement) fireHeld=true;
});
document.addEventListener('mouseup',e=>{
  if(e.button===0){
    fireHeld=false;
    cancelPickupHold();
  }
});

syncHeldWeapon();

let lookTouch=null,touchX=0,touchY=0;renderer.domElement.addEventListener('touchstart',e=>{for(const t of e.changedTouches)if(t.clientX>innerWidth*.34){lookTouch=t.identifier;touchX=t.clientX;touchY=t.clientY;break}},{passive:false});renderer.domElement.addEventListener('touchmove',e=>{for(const t of e.changedTouches)if(t.identifier===lookTouch){yaw-=(t.clientX-touchX)*.006;pitch-=(t.clientY-touchY)*.006;pitch=THREE.MathUtils.clamp(pitch,-Math.PI/2+.015,Math.PI/2-.015);touchX=t.clientX;touchY=t.clientY;e.preventDefault()}},{passive:false});
const joystick=document.getElementById('joystick'),stick=document.getElementById('stick');let joystickTouch=null;function moveJoy(t){const r=joystick.getBoundingClientRect();let x=t.clientX-r.left-60,y=t.clientY-r.top-60,l=Math.hypot(x,y);if(l>40){x=x/l*40;y=y/l*40}joystickX=x/40;joystickY=y/40;stick.style.left=`${35+x}px`;stick.style.top=`${35+y}px`}joystick.addEventListener('touchstart',e=>{const t=e.changedTouches[0];joystickTouch=t.identifier;moveJoy(t);e.preventDefault()},{passive:false});joystick.addEventListener('touchmove',e=>{for(const t of e.changedTouches)if(t.identifier===joystickTouch){moveJoy(t);e.preventDefault()}},{passive:false});joystick.addEventListener('touchend',()=>{joystickTouch=null;joystickX=joystickY=0;stick.style.left=stick.style.top='35px'});
document.getElementById('fireButton').addEventListener('touchstart',e=>{e.preventDefault();fire()},{passive:false});const adsBtn=document.getElementById('adsButton');adsBtn.addEventListener('touchstart',e=>{e.preventDefault();setADS(true)},{passive:false});adsBtn.addEventListener('touchend',e=>{e.preventDefault();setADS(false)},{passive:false});document.getElementById('jumpButton').addEventListener('touchstart',e=>{e.preventDefault();jump()},{passive:false});

addEventListener('resize',()=>{renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()});
const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.033);updateMovement(dt);updateReload();updateEffects(dt);updateCamera(dt);updateWeapon(dt);updateCasings(dt);renderer.render(scene,camera)}animate();
</script>
</body>
